<!-- 総合修正・機能拡張パッチ (v9.4) -->
    <script>
    'use strict';
    try { window.MAX_PLAYER_LEVEL = 999; } catch (e) {}

    (function initGame9PatchV94() {
        if (window.__v94PatchLoaded) return;
        window.__v94PatchLoaded = true;

        const MAX_PLAYER_LV_V9 = 999;
        let trackedGame = null;

        function getGameInstance() {
            if (window.game && typeof window.game === 'object') return window.game;
            return trackedGame;
        }

        // -----------------------------------------------------------------
        // 1. 白っぽい背景（単色＆グラデーション）＋白文字のコントラスト自動補正
        // -----------------------------------------------------------------
        function parseRgba(str) {
            if (!str || str === 'transparent') return { r: 0, g: 0, b: 0, a: 0 };
            const m = String(str).match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*,\s*([\d.]+))?\s*\)/i);
            if (m) {
                return { r: Number(m[1]), g: Number(m[2]), b: Number(m[3]), a: m[4] !== undefined ? Number(m[4]) : 1 };
            }
            const hex = String(str).trim();
            if (hex.startsWith('#')) {
                let h = hex.slice(1);
                if (h.length === 3) h = h.split('').map(c => c + c).join('');
                if (h.length >= 6) {
                    return {
                        r: parseInt(h.slice(0, 2), 16) || 0,
                        g: parseInt(h.slice(2, 4), 16) || 0,
                        b: parseInt(h.slice(4, 6), 16) || 0,
                        a: 1
                    };
                }
            }
            return { r: 0, g: 0, b: 0, a: 0 };
        }

        function calcLuminance(r, g, b) {
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function getGradientAvgLuminance(bgImg) {
            if (!bgImg || bgImg === 'none' || !bgImg.includes('gradient')) return null;
            const matches = bgImg.match(/rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}/g);
            if (!matches || matches.length === 0) return null;
            let sum = 0, count = 0;
            for (const token of matches) {
                const c = parseRgba(token);
                if (c.a > 0.1) { sum += calcLuminance(c.r, c.g, c.b); count++; }
            }
            return count > 0 ? (sum / count) : null;
        }

        function getEffectiveBgLuminance(el) {
            const layers = [];
            let cur = el;
            while (cur && cur.nodeType === 1) {
                const cs = window.getComputedStyle(cur);
                const gradLum = getGradientAvgLuminance(cs.backgroundImage);
                if (gradLum !== null) return gradLum;
                const bg = parseRgba(cs.backgroundColor);
                if (bg.a > 0.02) {
                    layers.unshift(bg);
                    if (bg.a >= 0.96) break;
                }
                cur = cur.parentElement;
            }
            let r = 15, g = 23, b = 42;
            for (const ly of layers) {
                r = ly.r * ly.a + r * (1 - ly.a);
                g = ly.g * ly.a + g * (1 - ly.a);
                b = ly.b * ly.a + b * (1 - ly.a);
            }
            return calcLuminance(r, g, b);
        }

        function fixElementContrast(el) {
            if (!el || el.nodeType !== 1) return;
            if (el.classList && el.classList.contains('world-plate')) return;
            const cs = window.getComputedStyle(el);
            const fg = parseRgba(cs.color);
            if (calcLuminance(fg.r, fg.g, fg.b) >= 0.58) {
                const bgLum = getEffectiveBgLuminance(el);
                if (bgLum >= 0.52) {
                    el.style.setProperty('color', '#0f172a', 'important');
                    el.style.setProperty('text-shadow', 'none', 'important');
                }
            }
        }

        function scanAllContrast(root) {
            const target = root || document.body;
            if (!target) return;
            if (target.nodeType === 1) fixElementContrast(target);
            const nodes = target.querySelectorAll
                ? target.querySelectorAll('button, span, div, p, a, b, strong, label, input, textarea, select, h1, h2, h3, h4')
                : [];
            for (let i = 0; i < nodes.length; i++) {
                fixElementContrast(nodes[i]);
            }
        }

        // -----------------------------------------------------------------
        // 2. スキル情報取得・空スロットガード・3Dスキルエフェクト自動生成
        // -----------------------------------------------------------------
        function getEquippedSkillsArray(d) {
            if (!d) return [];
            if (Array.isArray(d.equippedSkills)) return d.equippedSkills;
            if (Array.isArray(d.skillSlots)) return d.skillSlots;
            if (Array.isArray(d.slots)) return d.slots;
            if (Array.isArray(d.equipSkills)) return d.equipSkills;
            return [];
        }

        function getSkillByIdV9(skillId) {
            if (!skillId) return null;
            if (typeof SKILLS !== 'undefined') {
                if (Array.isArray(SKILLS)) return SKILLS.find(s => s && s.id === skillId) || null;
                if (SKILLS[skillId]) return SKILLS[skillId];
            }
            if (typeof SKILL_DB !== 'undefined' && SKILL_DB[skillId]) return SKILL_DB[skillId];
            if (typeof SKILL_LIST !== 'undefined' && Array.isArray(SKILL_LIST)) {
                return SKILL_LIST.find(s => s && s.id === skillId) || null;
            }
            return null;
        }

        function getAimDirectionAndTarget(g) {
            const pPos = (g.player && g.player.pos) ? g.player.pos.clone() : new THREE.Vector3();
            let dir = new THREE.Vector3(0, 0, 1);
            if (g.player) {
                const rot = Number(g.player.rotY ?? g.player.rotationY ?? (g.player.mesh && g.player.mesh.rotation.y) ?? 0);
                dir.set(Math.sin(rot), 0, Math.cos(rot)).normalize();
            }

            let targetPos = pPos.clone().addScaledVector(dir, 5.0);
            const tgt = g.lockedTarget || g.targetMonster || g.currentTarget;
            if (tgt && !tgt.dead && tgt.pos) {
                targetPos = tgt.pos.clone();
                const toTgt = targetPos.clone().sub(pPos);
                toTgt.y = 0;
                if (toTgt.lengthSq() > 0.01) dir = toTgt.normalize();
            } else if (Array.isArray(g.monsters)) {
                let bestDist = 18;
                for (const m of g.monsters) {
                    if (!m || m.dead || !m.pos) continue;
                    const dist = Math.hypot(m.pos.x - pPos.x, m.pos.z - pPos.z);
                    if (dist < bestDist) {
                        bestDist = dist;
                        targetPos = m.pos.clone();
                        const toTgt = targetPos.clone().sub(pPos);
                        toTgt.y = 0;
                        if (toTgt.lengthSq() > 0.01) dir = toTgt.normalize();
                    }
                }
            }
            return { pPos, dir, targetPos };
        }

        function spawnFallbackSkill3DEffect(g, skillId) {
            if (!g || !g.scene || typeof THREE === 'undefined') return;
            if (!Array.isArray(g._slashEffects)) g._slashEffects = [];

            const sk = getSkillByIdV9(skillId) || {};
            const label = `${skillId || ''} ${sk.name || ''} ${sk.type || ''} ${sk.element || ''}`.toLowerCase();
            const { pPos, dir, targetPos } = getAimDirectionAndTarget(g);

            // 1) 回復・補助・バフ系
            if (/heal|buff|bless|support|shield|guard|cure|聖|癒|護|祈|加護|祝福|再生/.test(label)) {
                const grp = new THREE.Group();
                grp.position.set(pPos.x, 0.08, pPos.z);

                const innerMat = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
                const innerRing = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.35, 32), innerMat);
                innerRing.rotation.x = -Math.PI / 2;
                grp.add(innerRing);

                const outerMat = new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
                const outerRing = new THREE.Mesh(new THREE.RingGeometry(1.7, 2.05, 32), outerMat);
                outerRing.rotation.x = -Math.PI / 2;
                grp.add(outerRing);

                const veilMat = new THREE.MeshBasicMaterial({ color: 0x6ee7b7, transparent: true, opacity: 0.34, side: THREE.DoubleSide });
                const veilCyl = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 3.2, 24, 1, true), veilMat);
                veilCyl.position.y = 1.6;
                grp.add(veilCyl);

                g.scene.add(grp);
                g._slashEffects.push({
                    kind: 'support_bless',
                    mesh: grp,
                    followEntity: g.player,
                    innerRing, outerRing, veilCyl,
                    innerMat, outerMat, veilMat,
                    life: 0.95,
                    maxLife: 0.95
                });
                return;
            }

            // 2) 氷・水・凍結系
            if (/ice|aqua|frost|blizzard|freeze|nova|氷|凍|吹雪|冷|水/.test(label)) {
                const grp = new THREE.Group();
                grp.position.set(targetPos.x, 0.1, targetPos.z);

                const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
                const magicRing = new THREE.Mesh(new THREE.RingGeometry(1.4, 2.8, 28), ringMat);
                magicRing.rotation.x = -Math.PI / 2;
                grp.add(magicRing);

                const spikeMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.92 });
                const spikes = [];
                for (let i = 0; i < 8; i++) {
                    const ang = (i / 8) * Math.PI * 2;
                    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.32, 2.6, 6), spikeMat);
                    sp.position.set(Math.cos(ang) * 1.6, -1.0, Math.sin(ang) * 1.6);
                    grp.add(sp);
                    spikes.push(sp);
                }

                g.scene.add(grp);
                g._slashEffects.push({
                    kind: 'nova_ice',
                    mesh: grp,
                    magicRing, ringMat, spikes, spikeMat,
                    life: 0.85,
                    maxLife: 0.85
                });
                return;
            }

            // 3) ビーム・雷・レーザー系
            if (/beam|laser|thunder|bolt|lightning|ray|cannon|雷|電|光線|砲|ビーム/.test(label)) {
                const grp = new THREE.Group();
                const beamLen = 14;
                grp.position.set(pPos.x + dir.x * (beamLen * 0.5 + 0.8), 1.2, pPos.z + dir.z * (beamLen * 0.5 + 0.8));
                grp.lookAt(pPos.x + dir.x * 20, 1.2, pPos.z + dir.z * 20);

                const outerMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.75 });
                const outerCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, beamLen, 16, 1, true), outerMat);
                outerCyl.rotation.x = Math.PI / 2;
                grp.add(outerCyl);

                const coreMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.95 });
                const coreCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, beamLen, 12), coreMat);
                coreCyl.rotation.x = Math.PI / 2;
                grp.add(coreCyl);

                g.scene.add(grp);
                g._slashEffects.push({
                    kind: 'beam',
                    mesh: grp,
                    outerCyl, coreCyl, outerMat, coreMat,
                    life: 0.6,
                    maxLife: 0.6
                });
                return;
            }

            // 4) 究極・爆発・隕石・ビッグバン系
            if (/bigbang|meteor|explode|explosion|omega|ultima|終焉|隕石|爆発|ビッグバン|滅/.test(label)) {
                const grp = new THREE.Group();
                grp.position.set(targetPos.x, 1.2, targetPos.z);

                const coreMat = new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.95 });
                const coreSphere = new THREE.Mesh(new THREE.SphereGeometry(1.3, 18, 18), coreMat);
                grp.add(coreSphere);

                const auraMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.65, wireframe: true });
                const auraSphere = new THREE.Mesh(new THREE.SphereGeometry(2.1, 16, 16), auraMat);
                grp.add(auraSphere);

                const waveMat = new THREE.MeshBasicMaterial({ color: 0xfb923c, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
                const waveRing = new THREE.Mesh(new THREE.RingGeometry(1.5, 2.4, 32), waveMat);
                waveRing.rotation.x = -Math.PI / 2;
                waveRing.position.y = -1.0;
                grp.add(waveRing);

                g.scene.add(grp);
                g._slashEffects.push({
                    kind: 'bigbang',
                    mesh: grp,
                    coreSphere, auraSphere, waveRing,
                    coreMat, auraMat, waveMat,
                    life: 0.85,
                    maxLife: 0.85
                });
                return;
            }

            // 5) 標準攻撃スキル（斬撃・炎・闇・打撃などの飛翔エネルギー波）
            let mainColor = 0x38bdf8;
            if (/fire|flame|burn|炎|火|紅蓮/.test(label)) mainColor = 0xf97316;
            else if (/dark|shadow|abyss|闇|黒|影/.test(label)) mainColor = 0xa855f7;
            else if (/wind|gale|storm|風|嵐|疾/.test(label)) mainColor = 0x34d399;
            else if (/holy|light|star|光|星|閃/.test(label)) mainColor = 0xfde047;

            const grp = new THREE.Group();
            grp.position.set(pPos.x + dir.x * 1.4, 1.15, pPos.z + dir.z * 1.4);
            grp.lookAt(pPos.x + dir.x * 15, 1.15, pPos.z + dir.z * 15);

            const mat = new THREE.MeshBasicMaterial({ color: mainColor, transparent: true, opacity: 0.92, side: THREE.DoubleSide });
            const arcMesh = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.18, 8, 24, Math.PI * 1.15), mat);
            arcMesh.rotation.z = -Math.PI * 0.575;
            grp.add(arcMesh);

            const subMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
            const subArc = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.09, 6, 20, Math.PI), subMat);
            subArc.rotation.z = -Math.PI * 0.5;
            grp.add(subArc);

            g.scene.add(grp);
            g._slashEffects.push({
                mesh: grp,
                mat,
                vx: dir.x * 22,
                vy: 0,
                vz: dir.z * 22,
                life: 0.45,
                maxLife: 0.45
            });
        }

        function triggerSkillSlotV9(slotIdx) {
            const g = getGameInstance();
            if (!g || !g.saveData) return;

            const equipped = getEquippedSkillsArray(g.saveData);
            const skillId = equipped[slotIdx];
            // 空のスキルスロットなら何もせず終了（ちゃぶ台誤発動防止）
            if (!skillId) return;

            if (typeof sfx !== 'undefined' && sfx.init) {
                try { sfx.init(); } catch (e) {}
            }

            const beforeCount = Array.isArray(g._slashEffects) ? g._slashEffects.length : 0;

            if (typeof g.useSkillSlot === 'function') g.useSkillSlot(slotIdx);
            else if (typeof g.useSkill === 'function') g.useSkill(slotIdx);
            else if (typeof g.useEquippedSkill === 'function') g.useEquippedSkill(slotIdx);
            else if (typeof g.castSkill === 'function') g.castSkill(skillId);

            const afterCount = Array.isArray(g._slashEffects) ? g._slashEffects.length : 0;
            // 本体側でスキルエフェクトが生成されなかった場合のみ、スキル対応3Dエフェクトを補完生成
            if (afterCount <= beforeCount) {
                spawnFallbackSkill3DEffect(g, skillId);
            }
        }

        function syncSkillSlotsDOM() {
            const container = document.getElementById('skill-slots-container');
            if (!container) return;

            if (container.children.length < 5) {
                container.innerHTML = '';
                for (let i = 0; i < 5; i++) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.id = `skill-slot-${i}`;
                    btn.className = `skill-slot-btn skill-arc-${i}`;
                    btn.innerHTML = `
                        <span class="sk-icon" style="font-size:15px;line-height:1;">・</span>
                        <span class="sk-name" style="font-size:8px;font-weight:900;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">空枠</span>
                        <div class="skill-cd-overlay hidden"></div>
                    `;
                    let lastTap = 0;
                    const onTap = (e) => {
                        if (e) { e.preventDefault(); e.stopPropagation(); }
                        const now = performance.now();
                        if (now - lastTap < 140) return;
                        lastTap = now;
                        triggerSkillSlotV9(i);
                    };
                    btn.addEventListener('touchstart', onTap, { passive: false });
                    btn.addEventListener('click', onTap);
                    container.appendChild(btn);
                }
            }

            const g = getGameInstance();
            if (!g || !g.saveData) return;
            const equipped = getEquippedSkillsArray(g.saveData);

            for (let i = 0; i < 5; i++) {
                const btn = container.children[i];
                if (!btn) continue;
                const skId = equipped[i];
                const sk = getSkillByIdV9(skId);
                const iconEl = btn.querySelector('.sk-icon');
                const nameEl = btn.querySelector('.sk-name');
                const cdEl = btn.querySelector('.skill-cd-overlay');

                if (skId && sk) {
                    if (iconEl) iconEl.textContent = sk.icon || '⚡';
                    if (nameEl) nameEl.textContent = (sk.name || skId).slice(0, 4);
                    btn.style.opacity = '1';
                    btn.style.borderColor = '#38bdf8';
                    btn.disabled = false;
                } else {
                    if (iconEl) iconEl.textContent = '－';
                    if (nameEl) nameEl.textContent = '空枠';
                    btn.style.opacity = '0.35';
                    btn.style.borderColor = '#334155';
                    btn.disabled = true;
                }

                if (cdEl) {
                    const cds = g.skillCooldowns || g.cooldowns || {};
                    const rem = skId ? Number(cds[skId] || 0) : 0;
                    if (skId && rem > 0.05) {
                        cdEl.classList.remove('hidden');
                        cdEl.textContent = rem >= 10 ? `${Math.ceil(rem)}s` : `${rem.toFixed(1)}s`;
                    } else {
                        cdEl.classList.add('hidden');
                    }
                }
            }
        }

        // -----------------------------------------------------------------
        // 3. 独立アニメーションループ（_slashEffects / effects が絶対止まらない）
        // -----------------------------------------------------------------
        function tickCombatEffectsFrame(g, dt) {
            if (!g) return;

            if (Array.isArray(g._slashEffects) && g._slashEffects.length > 0) {
                const now = performance.now();
                g._slashEffects = g._slashEffects.filter(ef => {
                    if (!ef || !ef.mesh) return false;
                    if (!ef._bornTs) ef._bornTs = now;

                    if (ef.delay && ef.delay > 0) {
                        ef.delay -= dt;
                        ef.mesh.visible = false;
                        return true;
                    }
                    ef.mesh.visible = true;

                    ef.life = (Number.isFinite(ef.life) ? ef.life : 0.45) - dt;

                    // 寿命切れ、または3.5秒以上経過したエフェクトは強制削除
                    if (ef.life <= 0 || (now - ef._bornTs) > 3500) {
                        if (g.scene) g.scene.remove(ef.mesh);
                        ef.mesh.traverse?.(o => {
                            o.geometry?.dispose?.();
                            o.material?.dispose?.();
                        });
                        return false;
                    }

                    const maxL = (Number.isFinite(ef.maxLife) && ef.maxLife > 0) ? ef.maxLife : 0.55;
                    const p = Math.max(0, Math.min(1, 1 - (ef.life / maxL)));
                    const fade = 1 - p;

                    if (ef.lvEvo) {
                        ef.lvEvo.rings?.forEach(r => { r.mesh.rotation.z += dt * r.spd; r.mat.opacity = fade * 0.92; });
                        ef.lvEvo.gyroRings?.forEach(gR => { gR.mesh.rotation.x += dt * gR.rx; gR.mesh.rotation.y += dt * gR.ry; gR.mesh.rotation.z += dt * gR.rz; gR.mat.opacity = fade * 0.88; });
                        ef.lvEvo.orbs?.forEach(o => {
                            o.ang += dt * o.spd;
                            o.orb.position.x = Math.cos(o.ang) * o.radius;
                            o.orb.position.z = Math.sin(o.ang) * o.radius;
                            o.orb.position.y = o.baseY + Math.sin(p * Math.PI * 3 + o.ang) * 0.45;
                            o.orb.rotation.y += dt * 6.0;
                        });
                        if (ef.lvEvo.pillar) {
                            ef.lvEvo.pillar.rotation.y -= dt * 3.0;
                            ef.lvEvo.pillar.scale.set(0.8 + p * 0.65, 1, 0.8 + p * 0.65);
                            if (ef.lvEvo.pillarMat) ef.lvEvo.pillarMat.opacity = fade * (0.32 + ef.lvEvo.tier * 0.06);
                        }
                    }

                    if (ef.kind === 'support_bless') {
                        if (ef.followEntity?.pos) ef.mesh.position.set(ef.followEntity.pos.x, 0.08, ef.followEntity.pos.z);
                        if (ef.innerRing) ef.innerRing.rotation.z += dt * 4.0;
                        if (ef.outerRing) ef.outerRing.rotation.z -= dt * 3.0;
                        if (ef.halo) { ef.halo.position.y = 2.55 + Math.sin(p * Math.PI) * 0.45; ef.halo.rotation.z += dt * 5.0; }
                        if (ef.veilCyl) ef.veilCyl.scale.set(0.85 + p * 0.45, 1, 0.85 + p * 0.45);
                        if (ef.innerMat) ef.innerMat.opacity = fade * 0.92;
                        if (ef.outerMat) ef.outerMat.opacity = fade * 0.88;
                        if (ef.haloMat) ef.haloMat.opacity = fade * 0.96;
                        if (ef.veilMat) ef.veilMat.opacity = fade * 0.34;
                        ef.crosses?.forEach(c => {
                            c.ang += dt * 2.6;
                            c.mesh.position.x = Math.cos(c.ang) * c.dist;
                            c.mesh.position.z = Math.sin(c.ang) * c.dist;
                            c.mesh.position.y += c.vy * dt;
                            c.mesh.rotation.y += dt * 4.5;
                            if (c.mat) c.mat.opacity = fade * 0.95;
                        });
                    } else if (ef.kind === 'bigbang') {
                        ef.coreSphere?.scale.setScalar(Math.max(0.1, fade * 2.2));
                        if (ef.auraSphere) { ef.auraSphere.scale.setScalar(0.4 + p * 2.4); ef.auraSphere.rotation.y += dt * 4.0; }
                        ef.waveRing?.scale.setScalar(0.5 + p * 2.6);
                        if (ef.coreMat) ef.coreMat.opacity = fade;
                        if (ef.auraMat) ef.auraMat.opacity = fade * 0.65;
                        if (ef.waveMat) ef.waveMat.opacity = fade * 0.92;
                        ef.meteors?.forEach(m => {
                            m.mesh.position.x += m.vx * dt;
                            m.mesh.position.y += m.vy * dt;
                            m.mesh.position.z += m.vz * dt;
                            m.mesh.rotation.y += dt * 8.0;
                            m.mesh.scale.setScalar(Math.max(0.1, 1 - p * 0.8));
                        });
                    } else if (ef.kind === 'chabudai') {
                        ef.mesh.position.x += (ef.vx || 0) * dt;
                        ef.mesh.position.z += (ef.vz || 0) * dt;
                        ef.mesh.position.y = 1.0 + Math.sin(p * Math.PI) * 3.0;
                        ef.mesh.rotation.x = p * Math.PI * 4.5;
                        ef.mesh.rotation.z = p * Math.PI * 1.4;
                    } else if (ef.kind === 'beam') {
                        const pulse = Math.sin(p * Math.PI);
                        ef.outerCyl?.scale.set(0.6 + pulse * 0.8, 1, 0.6 + pulse * 0.8);
                        ef.coreCyl?.scale.set(0.5 + pulse * 0.7, 1, 0.5 + pulse * 0.7);
                        if (ef.outerMat) ef.outerMat.opacity = fade * 0.75;
                        if (ef.coreMat) ef.coreMat.opacity = fade * 0.98;
                        ef.rings?.forEach((r, idx) => { r.rotation.z += dt * (idx % 2 === 0 ? 8 : -8); r.scale.setScalar(0.8 + pulse * 0.6); });
                    } else if (ef.kind === 'nova_ice') {
                        const rise = Math.min(1, p * 3.2);
                        ef.spikes?.forEach((sp, idx) => { sp.position.y = -1.2 + rise * 2.55; sp.rotation.y += dt * (idx % 2 === 0 ? 2 : -2); });
                        if (ef.magicRing) ef.magicRing.rotation.z += dt * 2.5;
                        ef.dome?.scale.setScalar(0.5 + p * 0.95);
                        if (ef.ringMat) ef.ringMat.opacity = fade * 0.85;
                        if (ef.domeMat) ef.domeMat.opacity = fade * 0.4;
                        if (ef.spikeMat) ef.spikeMat.opacity = p > 0.7 ? fade * 3.0 : 0.92;
                    } else {
                        ef.mesh.position.x += (ef.vx || 0) * dt;
                        ef.mesh.position.y += (ef.vy || 0) * dt;
                        ef.mesh.position.z += (ef.vz || 0) * dt;
                        ef.mesh.scale.setScalar(1 + p * 0.45);
                        if (ef.mat) ef.mat.opacity = fade * 0.92;
                    }

                    return true;
                });
            }

            if (Array.isArray(g.effects) && g.effects.length > 0) {
                const now = performance.now();
                g.effects = g.effects.filter(ef => {
                    if (!ef || !ef.mesh) return false;
                    if (!ef._bornTs) ef._bornTs = now;
                    if ((now - ef._bornTs) > 3500) {
                        if (g.scene) g.scene.remove(ef.mesh);
                        return false;
                    }
                    return true;
                });
            }
        }

        let lastRafTs = performance.now();
        function independentEffectLoop(now) {
            const dt = Math.min(0.1, Math.max(0.001, (now - lastRafTs) / 1000));
            lastRafTs = now;

            const g = getGameInstance();
            if (g) {
                tickCombatEffectsFrame(g, dt);
                syncSkillSlotsDOM();
            }
            requestAnimationFrame(independentEffectLoop);
        }
        requestAnimationFrame(independentEffectLoop);

        function showPatchAppliedBadge() {
            if (!document.body || document.getElementById('kmj-v9-badge')) return;
            const badge = document.createElement('div');
            badge.id = 'kmj-v9-badge';
            badge.textContent = '✅ v9.4適用済';
            badge.style.cssText = 'position:fixed;left:8px;bottom:4px;z-index:9999;background:rgba(15,23,42,0.88);color:#6ee7b7;border:1px solid #34d399;border-radius:6px;padding:1px 6px;font-size:9px;font-weight:900;pointer-events:none;';
            document.body.appendChild(badge);
        }

        if (typeof MutationObserver !== 'undefined') {
            let scanQueued = false;
            const observer = new MutationObserver(() => {
                if (scanQueued) return;
                scanQueued = true;
                requestAnimationFrame(() => {
                    scanQueued = false;
                    syncSkillSlotsDOM();
                    scanAllContrast(document.body);
                });
            });
            const startDomHooks = () => {
                if (!document.body) return;
                syncSkillSlotsDOM();
                scanAllContrast(document.body);
                showPatchAppliedBadge();
                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['style', 'class']
                });
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startDomHooks);
            } else {
                startDomHooks();
            }
        }

        if (typeof window.getKaomojiFaceTexture === 'function' && !window.getKaomojiFaceTexture._v9Wrapped) {
            const _origFaceTex = window.getKaomojiFaceTexture;
            const wrappedFaceTex = function (kaomoji, bgHex, textHex, borderHex) {
                const bg = parseRgba(bgHex || '#073b66');
                const fg = parseRgba(textHex || '#ffffff');
                let safeTextHex = textHex || '#ffffff';
                if (calcLuminance(bg.r, bg.g, bg.b) >= 0.52 && calcLuminance(fg.r, fg.g, fg.b) >= 0.52) {
                    safeTextHex = '#0f172a';
                }
                return _origFaceTex.call(this, kaomoji, bgHex, safeTextHex, borderHex);
            };
            wrappedFaceTex._v9Wrapped = true;
            window.getKaomojiFaceTexture = wrappedFaceTex;
        }

        // -----------------------------------------------------------------
        // 4. KaomojiMMORPG への処理組み込み
        // -----------------------------------------------------------------
        function hookKaomojiPrototype() {
            if (typeof KaomojiMMORPG === 'undefined') return false;
            const P = KaomojiMMORPG.prototype;
            if (P._v9PatchApplied) return true;
            P._v9PatchApplied = true;

            // どのメソッドが呼ばれてもゲームインスタンスを捕捉
            const captureInstance = function () { trackedGame = this; };

            // スキル発動メソッドの空スロットガード＆エフェクト補完
            ['useSkillSlot', 'useSkill', 'useEquippedSkill'].forEach(methodName => {
                if (typeof P[methodName] === 'function') {
                    const _orig = P[methodName];
                    P[methodName] = function (slotIdx, ...args) {
                        captureInstance.call(this);
                        const equipped = getEquippedSkillsArray(this.saveData);
                        const skillId = equipped[slotIdx];
                        if (!skillId) return; // 空スロットなら即終了

                        const beforeCount = Array.isArray(this._slashEffects) ? this._slashEffects.length : 0;
                        const res = _orig.call(this, slotIdx, ...args);
                        const afterCount = Array.isArray(this._slashEffects) ? this._slashEffects.length : 0;
                        if (afterCount <= beforeCount) {
                            spawnFallbackSkill3DEffect(this, skillId);
                        }
                        return res;
                    };
                }
            });

            if (typeof P.castSkill === 'function') {
                const _origCastSkill = P.castSkill;
                P.castSkill = function (skillId, ...args) {
                    captureInstance.call(this);
                    if (!skillId) return;
                    const beforeCount = Array.isArray(this._slashEffects) ? this._slashEffects.length : 0;
                    const res = _origCastSkill.call(this, skillId, ...args);
                    const afterCount = Array.isArray(this._slashEffects) ? this._slashEffects.length : 0;
                    if (afterCount <= beforeCount) {
                        spawnFallbackSkill3DEffect(this, skillId);
                    }
                    return res;
                };
            }

            // レベル上限 999
            P.getSafeExpNeeded = function (lv) {
                const curLv = Math.max(1, Math.floor(Number(lv) || 1));
                if (typeof this.getExpNeeded === 'function') {
                    const val = Number(this.getExpNeeded(curLv));
                    if (Number.isFinite(val) && val > 0) return val;
                }
                return Math.max(50, Math.floor(100 * Math.pow(curLv, 1.85)));
            };

            P.gainExp = function (amount) {
                captureInstance.call(this);
                const d = this.saveData;
                if (!d) return;
                if ((d.lv || 1) >= MAX_PLAYER_LV_V9) {
                    d.lv = MAX_PLAYER_LV_V9;
                    return;
                }
                const addExp = Number(amount);
                if (!Number.isFinite(addExp) || addExp <= 0) return;

                d.exp = (Number(d.exp) || 0) + addExp;
                let leveled = false;

                while ((d.lv || 1) < MAX_PLAYER_LV_V9) {
                    const need = this.getSafeExpNeeded(d.lv || 1);
                    if (d.exp < need) break;
                    d.exp -= need;
                    d.lv = (d.lv || 1) + 1;
                    d.ap = (d.ap || 0) + 3;
                    d.sp = (d.sp || 0) + 1;
                    leveled = true;
                }

                if (d.lv >= MAX_PLAYER_LV_V9) {
                    d.lv = MAX_PLAYER_LV_V9;
                    d.exp = 0;
                }

                if (leveled) {
                    const st = this.calcDerivedStats ? this.calcDerivedStats() : null;
                    if (this.player && st) {
                        this.player.hp = st.maxHp;
                        this.player.mp = st.maxMp;
                        if (this.spawnRingWave) this.spawnRingWave(this.player.pos, 0xfde047, 5.0);
                        if (this.spawnFloatText) {
                            this.spawnFloatText(
                                this.player.pos.clone().add(new THREE.Vector3(0, 2.8, 0)),
                                `🎉 LEVEL UP! Lv.${d.lv}`,
                                '#fde047',
                                18
                            );
                        }
                    }
                    if (typeof sfx !== 'undefined' && sfx.playLevelUp) sfx.playLevelUp();
                    if (this.showAlertBanner) {
                        const maxMsg = d.lv >= MAX_PLAYER_LV_V9 ? '（上限MAX達成！）' : '';
                        this.showAlertBanner(`🎉 レベルアップ！ Lv.${d.lv} になりました！${maxMsg}`, 2200);
                    }
                }
            };

            if (P.refreshAllHUD) {
                const _origRefreshAllHUD = P.refreshAllHUD;
                P.refreshAllHUD = function () {
                    captureInstance.call(this);
                    _origRefreshAllHUD.call(this);
                    syncSkillSlotsDOM();
                    const d = this.saveData;
                    if (!d) return;
                    const curLv = Math.min(MAX_PLAYER_LV_V9, Math.max(1, Number(d.lv) || 1));
                    const needExp = this.getSafeExpNeeded(curLv);
                    const expPct = curLv >= MAX_PLAYER_LV_V9 ? 100 : Math.max(0, Math.min(100, ((Number(d.exp) || 0) / needExp) * 100));
                    const expBar = document.getElementById('hud-exp-bar');
                    const pExp = document.getElementById('p-head-exp');
                    if (expBar) expBar.style.width = `${expPct}%`;
                    if (pExp) pExp.style.width = `${expPct}%`;
                };
            }

            // 格上レベル差補正（1Lv差ごとに +1.5倍 加算）
            const ADD_MULT_PER_LV = 1.5;

            P.getEnemyLevel = function (m) {
                if (!m) return 1;
                if (Number.isFinite(Number(m.lv)) && Number(m.lv) > 0) {
                    return Math.floor(Number(m.lv));
                }
                const threat = (this.saveData && Number(this.saveData.threatRank)) || 0;
                if (this.towerState && this.towerState.active) {
                    const floor = Number(this.towerState.floor) || 1;
                    return Math.max(1, floor * 3 + threat);
                }
                const zone = (typeof ZONES !== 'undefined' && ZONES[this.currentZoneId]) || null;
                const baseRecLv = zone ? (Number(zone.recLv) || 1) : 1;
                return Math.max(1, baseRecLv + threat + (m.isBoss ? 2 : 0));
            };

            P.getLevelDiffPenaltyMult = function (m) {
                const playerLv = (this.saveData && Number(this.saveData.lv)) || 1;
                const enemyLv = this.getEnemyLevel(m);
                const diff = enemyLv - playerLv;
                if (diff <= 0) return 1.0;
                const mult = 1.0 + ADD_MULT_PER_LV * diff;
                return Number.isFinite(mult) && mult > 1 ? mult : 1.0;
            };

            // 与ダメージ補正 ＋ NaN無敵バグ防止
            if (P.damageMonster) {
                const _origDamageMonster = P.damageMonster;
                P.damageMonster = function (m, rawDmg, isCrit = false, colorOverride = null) {
                    captureInstance.call(this);
                    if (!m || m.dead) return;
                    if (!Number.isFinite(m.maxHp) || m.maxHp <= 0) m.maxHp = 100;
                    if (!Number.isFinite(m.hp)) m.hp = m.maxHp;

                    let safeDmg = Number(rawDmg);
                    if (!Number.isFinite(safeDmg) || safeDmg <= 0) {
                        const st = this.calcDerivedStats ? this.calcDerivedStats() : null;
                        const baseAtk = st ? Math.max(st.physAtk || 10, st.magAtk || 10) : 10;
                        const petLv = (this.saveData && this.saveData.petLevel) || 1;
                        safeDmg = Math.max(1, Math.round(baseAtk * (0.35 + petLv * 0.05)));
                    }

                    const mult = this.getLevelDiffPenaltyMult(m);
                    if (mult > 1.0) {
                        safeDmg = Math.max(1, Math.round(safeDmg / mult));
                        if (!colorOverride) colorOverride = '#cbd5e1';
                    }

                    return _origDamageMonster.call(this, m, safeDmg, isCrit, colorOverride);
                };
            }

            // 被ダメージ補正（格上から喰らうダメージが 1 + 1.5×レベル差 倍）
            if (P.updateMonsters && P.damagePlayer) {
                const _origUpdateMonsters = P.updateMonsters;
                const _origDamagePlayer = P.damagePlayer;

                P.updateMonsters = function (dt, elapsed) {
                    captureInstance.call(this);
                    this._inMonsterAttackLoop = true;
                    try {
                        return _origUpdateMonsters.call(this, dt, elapsed);
                    } finally {
                        this._inMonsterAttackLoop = false;
                    }
                };

                P.damagePlayer = function (rawDmg, ignoreDef = false) {
                    let finalDmg = Number(rawDmg) || 1;
                    if (this._inMonsterAttackLoop && this.player && Array.isArray(this.monsters)) {
                        let maxMult = 1.0;
                        for (const m of this.monsters) {
                            if (!m || m.dead || !m.pos) continue;
                            const dist = Math.hypot(this.player.pos.x - m.pos.x, this.player.pos.z - m.pos.z);
                            if (dist <= 10.5) {
                                const mult = this.getLevelDiffPenaltyMult(m);
                                if (mult > maxMult) maxMult = mult;
                            }
                        }
                        if (maxMult > 1.0) {
                            finalDmg = Math.max(1, Math.round(finalDmg * maxMult));
                        }
                    }
                    return _origDamagePlayer.call(this, finalDmg, ignoreDef);
                };
            }

            // ペット攻撃による敵HP NaN監視・復旧
            if (P.updatePet) {
                const _origUpdatePet = P.updatePet;
                P.updatePet = function (dt, elapsed) {
                    captureInstance.call(this);
                    const hpSnap = new Map();
                    if (Array.isArray(this.monsters)) {
                        for (const m of this.monsters) {
                            if (m && !m.dead && Number.isFinite(m.hp)) hpSnap.set(m, m.hp);
                        }
                    }
                    _origUpdatePet.call(this, dt, elapsed);
                    if (Array.isArray(this.monsters)) {
                        const st = this.calcDerivedStats ? this.calcDerivedStats() : null;
                        const baseAtk = st ? Math.max(st.physAtk || 10, st.magAtk || 10) : 10;
                        const petLv = (this.saveData && this.saveData.petLevel) || 1;
                        const rawPetDmg = Math.max(1, Math.round(baseAtk * (0.35 + petLv * 0.05)));

                        for (const m of this.monsters) {
                            if (!m || m.dead) continue;
                            if (!Number.isFinite(m.hp)) {
                                const prevHp = hpSnap.has(m) ? hpSnap.get(m) : (m.maxHp || 100);
                                const mult = this.getLevelDiffPenaltyMult(m);
                                const safePetDmg = Math.max(1, Math.round(rawPetDmg / mult));
                                m.hp = Math.max(0, prevHp - safePetDmg);
                                m.aggro = true;
                                if (this.spawnFloatText && m.pos) {
                                    this.spawnFloatText(
                                        m.pos.clone().add(new THREE.Vector3(0, 1.4, 0)),
                                        `🐾${formatBigNum(safePetDmg)}`,
                                        mult > 1.0 ? '#cbd5e1' : '#6ee7b7',
                                        13
                                    );
                                }
                                if (m.hp <= 0 && this.onMonsterKilled) this.onMonsterKilled(m);
                            }
                        }
                    }
                };
            }

            // ゾーン移動時のエフェクト一括掃除
            P.cleanupAllCombatEffects = function () {
                if (Array.isArray(this._slashEffects)) {
                    for (const ef of this._slashEffects) {
                        if (ef && ef.mesh && this.scene) {
                            this.scene.remove(ef.mesh);
                            ef.mesh.traverse?.(o => { o.geometry?.dispose?.(); o.material?.dispose?.(); });
                        }
                    }
                    this._slashEffects = [];
                }
                if (Array.isArray(this.effects)) {
                    for (const ef of this.effects) {
                        if (ef && ef.mesh && this.scene) this.scene.remove(ef.mesh);
                    }
                    this.effects = [];
                }
            };

            if (P.loadZone) {
                const _origLoadZone = P.loadZone;
                P.loadZone = function (zoneId) {
                    captureInstance.call(this);
                    this.cleanupAllCombatEffects();
                    _origLoadZone.call(this, zoneId);
                };
            }

            return true;
        }

        if (!hookKaomojiPrototype()) {
            let tries = 0;
            const timer = setInterval(() => {
                tries++;
                if (hookKaomojiPrototype() || tries > 50) clearInterval(timer);
            }, 100);
            window.addEventListener('DOMContentLoaded', hookKaomojiPrototype);
        }
    })();
    </script>
</body>
