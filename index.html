            // -----------------------------------------------------------------
            // ステージ読み込み＆クリーンアップ
            // -----------------------------------------------------------------
            loadZone(zoneId) {
                const zone = ZONES[zoneId] || ZONES.town;
                this.currentZoneId = zone.id;
                this.selectedTarget = null;

                // 既存エンティティ破棄
                this.monsters.forEach(m => {
                    if (m.group && this.scene) this.scene.remove(m.group);
                    if (m.plateEl) m.plateEl.remove();
                });
                this.monsters = [];

                this.aiAllies.forEach(a => {
                    if (a.group && this.scene) this.scene.remove(a.group);
                });
                this.aiAllies = [];

                this.zoneProps.forEach(p => {
                    if (this.scene) this.scene.remove(p);
                });
                this.zoneProps = [];

                document.getElementById('boss-cast-box')?.classList.add('hidden');
                document.getElementById('warp-prompt-box')?.classList.add('hidden');

                if (this.useWebGL) {
                    this.scene.background = new THREE.Color(zone.skyColor);
                    this.scene.fog = new THREE.FogExp2(zone.skyColor, 0.015);
                    this.groundMat.color.setHex(zone.groundColor);
                    this.warpPortalMesh.visible = !zone.safe;

                    // 周囲の装飾柱
                    const propColor = zone.safe ? 0x38bdf8 : 0x475569;
                    const propMat = new THREE.MeshLambertMaterial({ color: propColor });
                    for (let i = 0; i < 8; i++) {
                        const ang = (i / 8) * Math.PI * 2;
                        const r = this.FIELD_LIMIT - 2.2;
                        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.65, 3.2, 8), propMat);
                        pillar.position.set(Math.cos(ang) * r, 1.6, Math.sin(ang) * r);
                        this.scene.add(pillar);
                        this.zoneProps.push(pillar);
                    }
                }

                // 狩場に入った際は中央ワープ陣のすぐ手前に配置（誤帰還防止）
                if (this.player) {
                    this.player.pos.set(0, 0, zone.safe ? 0 : 4.2);
                    if (this.player.group) this.player.group.position.copy(this.player.pos);
                }

                if (zone.safe) {
                    this.spawnTownAllies();
                } else {
                    const threat = this.saveData.threatRank || 0;
                    const threatMult = Math.pow(1.45, threat);
                    let idx = 0;
                    zone.monsters.forEach(mDef => {
                        for (let c = 0; c < mDef.count; c++) {
                            const ang = (idx * 1.65) + (mDef.isBoss ? 0 : 0.4);
                            const dist = mDef.isBoss ? 15.5 : (9.5 + (idx % 4) * 3.6);
                            const spawnPos = new THREE.Vector3(Math.cos(ang) * dist, 0, Math.sin(ang) * dist);
                            this.spawnMonsterEntity({
                                ...mDef,
                                lv: mDef.lv + threat * 5,
                                maxHp: Math.round(mDef.hp * threatMult),
                                atk: Math.round(mDef.atk * Math.pow(1.32, threat)),
                                exp: Math.round(mDef.exp * Math.pow(1.38, threat)),
                                gold: Math.round(mDef.gold * Math.pow(1.35, threat)),
                                spawnPos
                            });
                            idx++;
                        }
                    });
                }

                this.refreshAllHUD();
            }

            isOnWarpPortal(pos) {
                if (!pos || this.currentZoneId === 'town') return false;
                return Math.hypot(pos.x, pos.z) <= this.WARP_PORTAL_RADIUS;
            }

            clampPosition(pos) {
                const maxR = this.FIELD_LIMIT - 1.0;
                const d = Math.hypot(pos.x, pos.z);
                if (d > maxR) {
                    pos.x = (pos.x / d) * maxR;
                    pos.z = (pos.z / d) * maxR;
                }
            }

            // -----------------------------------------------------------------
            // 戦闘・スキル・エモート発動処理
            // -----------------------------------------------------------------
            getNearestMonster(maxRange = 999) {
                if (!this.player) return null;
                let best = null;
                let bestDist = maxRange;
                for (const m of this.monsters) {
                    if (m.dead) continue;
                    const d = this.player.pos.distanceTo(m.pos);
                    if (d < bestDist) {
                        bestDist = d;
                        best = m;
                    }
                }
                return best;
            }

            getValidTarget() {
                if (this.selectedTarget && !this.selectedTarget.dead) return this.selectedTarget;
                this.selectedTarget = this.getNearestMonster(24);
                return this.selectedTarget;
            }

            cycleTarget() {
                const alive = this.monsters.filter(m => !m.dead);
                if (alive.length === 0) {
                    this.showAlertBanner('近くに敵がいません', 1100);
                    return;
                }
                const curIdx = alive.indexOf(this.selectedTarget);
                this.selectedTarget = alive[(curIdx + 1) % alive.length];
                this.spawnRingEffect(this.selectedTarget.pos, 0x38bdf8, 1.8);
                this.showAlertBanner(`🎯 標的: ${this.selectedTarget.name} (Lv.${this.selectedTarget.lv})`, 1200);
            }

            damageMonster(m, rawDmg, isCrit = false) {
                if (!m || m.dead) return;
                const dmg = Math.max(1, Math.round(rawDmg));
                m.aggro = true;
                this.selectedTarget = m;
                m.hp = Math.max(0, m.hp - dmg);

                sfx.playHit(isCrit);
                this.spawnFloatingText(
                    m.pos,
                    isCrit ? `💥${formatBigNum(dmg)}!` : `${formatBigNum(dmg)}`,
                    isCrit ? '#fde047' : '#ffffff',
                    isCrit ? 1.25 : 1.0
                );

                if (m.hp <= 0) {
                    m.dead = true;
                    m.casting = null;
                    m.respawnTimer = m.isBoss ? 8.0 : 3.5;
                    if (m.group) m.group.visible = false;
                    if (m.plateEl) m.plateEl.style.display = 'none';
                    if (m.isRaidBoss) document.getElementById('boss-cast-box')?.classList.add('hidden');
                    if (this.selectedTarget === m) this.selectedTarget = null;
                    this.grantKillRewards(m);
                }
            }

            grantKillRewards(m) {
                const d = this.saveData;
                const st = this.calcDerivedStats();
                const gainExp = Math.round(m.exp * st.treeRewardMult);
                const gainGold = Math.round(m.gold * st.treeRewardMult);

                d.exp += gainExp;
                d.gold += gainGold;

                if (m.drop && MATERIALS[m.drop]) {
                    const dropAmt = m.isBoss ? (2 + Math.floor((d.threatRank || 0) / 2)) : 1;
                    d.materials[m.drop] = (d.materials[m.drop] || 0) + dropAmt;
                    this.spawnFloatingText(m.pos, `${MATERIALS[m.drop].icon}+${dropAmt}`, '#6ee7b7', 0.95);
                }

                let leveledUp = false;
                while (d.lv < 99 && d.exp >= this.getExpNeeded(d.lv)) {
                    d.exp -= this.getExpNeeded(d.lv);
                    d.lv += 1;
                    d.ap += 3;
                    d.sp += 1;
                    leveledUp = true;
                }
                if (d.lv >= 99) {
                    d.exp = Math.min(d.exp, this.getExpNeeded(99));
                }

                if (leveledUp) {
                    const newSt = this.calcDerivedStats();
                    this.player.hp = newSt.maxHp;
                    this.player.mp = newSt.maxMp;
                    sfx.playLevelUp();
                    this.spawnRingEffect(this.player.pos, 0xfde047, 3.8);
                    this.showAlertBanner(`🎉 LEVEL UP! Lv.${d.lv} 到達！(AP+3 / SP+1)`, 2500);
                    this.saveGame(false);
                }
            }

            damagePlayer(rawAtk) {
                if (!this.player || this.currentZoneId === 'town') return;
                if (this.player.invulnTimer > 0) return;

                const st = this.calcDerivedStats();
                const dmg = Math.max(1, Math.round(rawAtk * (1 - st.defMitigation)));
                this.player.hp = Math.max(0, this.player.hp - dmg);
                this.spawnFloatingText(this.player.pos, `-${formatBigNum(dmg)}`, '#fb7185', 1.05);

                if (this.player.hp <= 0) {
                    this.autoHunt = false;
                    const autoBtn = document.getElementById('btn-toggle-autohunt');
                    if (autoBtn) autoBtn.textContent = '🤖 AUTO:OFF';
                    this.loadZone('town');
                    const resetSt = this.calcDerivedStats();
                    this.player.hp = resetSt.maxHp;
                    this.player.mp = resetSt.maxMp;
                    this.showAlertBanner('💫 力尽きて「始まりの顔文字広場」へ帰還しました…', 2800);
                }
            }

            useSkillSlot(slotIdx) {
                if (!this.player || this.isModalOpen) return;
                const d = this.saveData;
                const skId = d.equippedSkills[slotIdx];
                const sk = skId ? SKILLS[skId] : null;
                if (!sk) return;

                if ((this.player.skillCds[slotIdx] || 0) > 0) return;
                if (this.player.mp < sk.cost) {
                    this.showAlertBanner('MPが足りません！', 950);
                    return;
                }

                const pPos = this.player.pos;
                const target = this.getValidTarget();
                const needsTarget = ['SINGLE_DMG', 'INTERRUPT', 'THUNDER', 'DRAIN'].includes(sk.type);
                if (needsTarget && (!target || target.dead)) {
                    this.showAlertBanner('攻撃対象の敵がいません！', 1000);
                    return;
                }

                const st = this.calcDerivedStats();
                this.player.mp -= sk.cost;
                this.player.skillCds[slotIdx] = Math.max(0.6, sk.cd * (1 - st.cdReduction));
                sfx.playSkill();

                const skLv = d.skills[skId] || 1;
                const lvScale = (1 + (skLv - 1) * 0.25) * st.treeSkillPowerMult;
                const healScale = (1 + (skLv - 1) * 0.25) * st.treeHealPowerMult;

                const extraCrit = sk.type === 'SINGLE_DMG' ? skLv * 0.025 : 0;
                const totalSkCrit = st.rawCritChance + extraCrit;
                const crit = Math.random() < Math.min(1.0, totalSkCrit);
                const skOverflowBonus = Math.max(0, totalSkCrit - 1.0) * 1.5;
                const critMult = crit ? (st.critDmg + (skOverflowBonus - st.overflowCritDmgBonus)) : 1.0;

                if (target && !target.dead) {
                    const dx = target.pos.x - pPos.x;
                    const dz = target.pos.z - pPos.z;
                    if (dx * dx + dz * dz > 0.01) this.player.rotY = Math.atan2(dx, dz);
                }

                const baseSkillDmg = st.physAtk * st.magMult * sk.power * lvScale;

                if (sk.type === 'SINGLE_DMG' || sk.type === 'THUNDER') {
                    this.damageMonster(target, baseSkillDmg * critMult, crit);
                    this.spawnSlashEffect(target.pos, sk.type === 'THUNDER' ? 0xfde047 : 0x38bdf8);
                } else if (sk.type === 'INTERRUPT') {
                    this.damageMonster(target, baseSkillDmg * critMult, crit);
                    target.stunTimer = 2.6;
                    if (target.casting) {
                        target.casting = null;
                        document.getElementById('boss-cast-box')?.classList.add('hidden');
                        this.showAlertBanner('🛡️ ボスの大技詠唱をブレイク中断！', 1800);
                    }
                    this.spawnRingEffect(target.pos, 0xfbbf24, 2.6);
                } else if (sk.type === 'DRAIN') {
                    const dealt = baseSkillDmg * critMult;
                    this.damageMonster(target, dealt, crit);
                    const heal = Math.round(dealt * 0.45);
                    this.player.hp = Math.min(st.maxHp, this.player.hp + heal);
                    this.spawnFloatingText(pPos, `🩸+${formatBigNum(heal)}`, '#34d399', 1.05);
                } else if (sk.type === 'AOE_DMG' || sk.type === 'AOE_SLOW' || sk.type === 'AOE_BURN') {
                    const rad = sk.radius || 6.5;
                    this.spawnRingEffect(pPos, sk.type === 'AOE_SLOW' ? 0x38bdf8 : (sk.type === 'AOE_BURN' ? 0xf97316 : 0xc084fc), rad);
                    this.monsters.forEach(m => {
                        if (!m.dead && pPos.distanceTo(m.pos) <= rad) {
                            this.damageMonster(m, baseSkillDmg * critMult, crit);
                            if (sk.type === 'AOE_SLOW') {
                                m.slowTimer = 5.0;
                                m.slowFactor = 0.5;
                            } else if (sk.type === 'AOE_BURN') {
                                m.burnTimer = 4.0;
                                m.burnDps = baseSkillDmg * 0.35;
                            }
                        }
                    });
                } else if (sk.type === 'HEAL' || sk.type === 'HEAL_MP') {
                    const healHp = Math.round(st.maxHp * sk.power * healScale);
                    this.player.hp = Math.min(st.maxHp, this.player.hp + healHp);
                    this.player.stunTimer = 0;
                    if (sk.type === 'HEAL_MP') {
                        const healMp = Math.round(st.maxMp * 0.25);
                        this.player.mp = Math.min(st.maxMp, this.player.mp + healMp);
                        this.spawnFloatingText(pPos, `🌈HP+${formatBigNum(healHp)} / MP+${formatBigNum(healMp)}`, '#6ee7b7', 1.1);
                    } else {
                        this.spawnFloatingText(pPos, `💚+${formatBigNum(healHp)}`, '#34d399', 1.1);
                    }
                    this.spawnRingEffect(pPos, 0x34d399, 3.0);
                } else if (sk.type === 'DEF_BUFF') {
                    this.player.defBuffTimer = 8.0;
                    this.player.defBuffBonus = sk.power;
                    this.player.invulnTimer = Math.max(this.player.invulnTimer, 1.2);
                    this.spawnRingEffect(pPos, 0x38bdf8, 3.2);
                    this.spawnFloatingText(pPos, '🔰 神域イージス展開！', '#7dd3fc', 1.05);
                } else if (sk.type === 'ATK_BUFF') {
                    this.player.warcryTimer = 10.0;
                    this.player.warcryBonus = 1 + sk.power;
                    this.spawnRingEffect(pPos, 0xf97316, 3.2);
                    this.spawnFloatingText(pPos, '🔥 覇王の咆哮！攻撃UP', '#fbbf24', 1.05);
                }

                if (this.player.wpnGroup) this.player.wpnGroup.rotation.x = 1.35;
            }

            triggerEmote(emoteId) {
                const em = EMOTES.find(e => e.id === emoteId);
                if (!em || !this.player) return;

                document.getElementById('emote-palette')?.classList.add('hidden');
                this.emoteTimer = 2.6;
                this.emoteMotion = em.motion;

                if (this.useWebGL && this.player.frontMat) {
                    this.player.frontMat.map = getKaomojiFaceTexture(em.kaomoji, '#073b66', '#ffffff', '#f472b6');
                    this.player.frontMat.needsUpdate = true;
                }

                sfx.playTone(587, 0.09, 'sine', 0.07);
                setTimeout(() => sfx.playTone(880, 0.12, 'triangle', 0.07), 65);

                if (em.id === 'tableflip') {
                    this.spawnRingEffect(this.player.pos, 0xf97316, 3.6);
                    this.spawnFloatingText(this.player.pos, '┻━┻ 彡(°□°)', '#fbbf24', 1.25);
                } else if (em.id === 'beam') {
                    this.spawnRingEffect(this.player.pos, 0x38bdf8, 4.2);
                    this.spawnFloatingText(this.player.pos, '━☆・*。⚡', '#7dd3fc', 1.2);
                } else {
                    this.spawnRingEffect(this.player.pos, 0xf472b6, 2.5);
                }

                this.spawnEmoteBubble(this.player.pos, em.kaomoji, em.msg, 2.8);

                // 安全な街にいる場合、仲間AI冒険者たちがリアクションを返す
                if (this.currentZoneId === 'town' && this.aiAllies.length > 0) {
                    this.aiAllies.forEach((ally, i) => {
                        setTimeout(() => {
                            if (this.currentZoneId === 'town') {
                                this.spawnEmoteBubble(ally.pos, ally.kaomoji, em.allyReply, 2.6);
                            }
                        }, 350 + i * 280);
                    });
                }
            }

            // -----------------------------------------------------------------
            // 軽量3Dエフェクト＆頭上テキスト・吹き出し
            // -----------------------------------------------------------------
            spawnSlashEffect(pos, colorHex = 0x38bdf8) {
                if (!this.useWebGL) return;
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 0.12, 0.25),
                    new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.95 })
                );
                mesh.position.set(pos.x, 1.1, pos.z);
                mesh.rotation.y = Math.random() * Math.PI;
                mesh.rotation.z = 0.5;
                this.scene.add(mesh);
                this.effects.push({ mesh, life: 0.22, maxLife: 0.22, expand: false });
            }

            spawnRingEffect(pos, colorHex = 0x38bdf8, radius = 3.0) {
                if (!this.useWebGL) return;
                const mesh = new THREE.Mesh(
                    new THREE.RingGeometry(0.3, radius, 28),
                    new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
                );
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(pos.x, 0.12, pos.z);
                this.scene.add(mesh);
                this.effects.push({ mesh, life: 0.35, maxLife: 0.35, expand: true });
            }

            spawnFloatingText(pos, text, color = '#ffffff', scale = 1.0) {
                const el = document.createElement('div');
                el.className = 'world-float-text';
                el.style.color = color;
                el.style.fontSize = `${Math.round(15 * scale)}px`;
                el.textContent = text;
                this.overlayLayer.appendChild(el);
                this.floatTexts.push({
                    el,
                    worldPos: new THREE.Vector3(pos.x + (Math.random() - 0.5) * 0.8, 2.2, pos.z),
                    life: 0.85
                });
            }

            spawnEmoteBubble(pos, kaomoji, msg, life = 2.6) {
                const el = document.createElement('div');
                el.className = 'world-emote-bubble';
                el.innerHTML = `<div class="font-kaomoji" style="font-size:12px; font-weight:900; color:#f9a8d4;">${kaomoji}</div><div style="font-size:10px; font-weight:800; color:#fff;">${msg}</div>`;
                this.overlayLayer.appendChild(el);
                this.emoteBubbles.push({
                    el,
                    worldPos: new THREE.Vector3(pos.x, 2.75, pos.z),
                    life
                });
            }

            showAlertBanner(msg, duration = 2000) {
                const banner = document.getElementById('alert-banner');
                if (!banner) return;
                banner.textContent = msg;
                banner.classList.remove('hidden');
                if (this.alertTimeout) clearTimeout(this.alertTimeout);
                this.alertTimeout = setTimeout(() => banner.classList.add('hidden'), duration);
            }
            // -----------------------------------------------------------------
            // メインループ＆フレーム更新処理
            // -----------------------------------------------------------------
            loop(now) {
                const dt = Math.min(0.05, Math.max(0.001, (now - this.lastTime) / 1000));
                this.lastTime = now;
                const elapsed = now / 1000;

                this.updatePlayer(dt, elapsed);
                this.updateMonsters(dt);
                this.updateAiAllies(dt);
                this.updateEffectsAndOverlays(dt);

                this.memCleanTimer += dt;
                if (this.memCleanTimer >= 25) {
                    this.memCleanTimer = 0;
                    this.cleanupMemory();
                }

                if (this.useWebGL && this.renderer && this.scene && this.camera) {
                    this.renderer.render(this.scene, this.camera);
                }

                requestAnimationFrame((t) => this.loop(t));
            }

            cleanupMemory() {
                if (this.useWebGL && this.renderer && this.renderer.info) {
                    const mem = this.renderer.info.memory;
                    if (mem && mem.geometries > 160) {
                        this.renderer.renderLists.dispose();
                    }
                }
            }

            updatePlayer(dt, elapsed) {
                if (!this.player) return;
                const st = this.calcDerivedStats();

                // 各種タイマー減算
                if (this.player.invulnTimer > 0) this.player.invulnTimer = Math.max(0, this.player.invulnTimer - dt);
                if (this.player.stunTimer > 0) this.player.stunTimer = Math.max(0, this.player.stunTimer - dt);
                if (this.player.defBuffTimer > 0) {
                    this.player.defBuffTimer = Math.max(0, this.player.defBuffTimer - dt);
                    if (this.player.defBuffTimer <= 0) this.player.defBuffBonus = 0;
                }
                if (this.player.warcryTimer > 0) {
                    this.player.warcryTimer = Math.max(0, this.player.warcryTimer - dt);
                    if (this.player.warcryTimer <= 0) this.player.warcryBonus = 1.0;
                }

                // エモート表情復帰タイマー
                if (this.emoteTimer > 0) {
                    this.emoteTimer = Math.max(0, this.emoteTimer - dt);
                    if (this.emoteTimer <= 0) {
                        this.emoteMotion = 'none';
                        if (this.useWebGL && this.player.frontMat) {
                            this.player.frontMat.map = getKaomojiFaceTexture(this.getBasePlayerKaomoji(), '#073b66', '#ffffff', '#38bdf8');
                            this.player.frontMat.needsUpdate = true;
                        }
                    }
                }

                // スキルクールダウン更新
                for (let i = 0; i < 5; i++) {
                    if (this.player.skillCds[i] > 0) {
                        this.player.skillCds[i] = Math.max(0, this.player.skillCds[i] - dt);
                    }
                }

                // 中央ワープ陣判定（勝手に飛ばず、乗っている間だけ帰還ボタンを表示）
                const warpBox = document.getElementById('warp-prompt-box');
                if (warpBox) {
                    if (this.isOnWarpPortal(this.player.pos)) {
                        warpBox.classList.remove('hidden');
                    } else {
                        warpBox.classList.add('hidden');
                    }
                }

                // 自然回復（安全な街では超高速回復）
                const inTown = this.currentZoneId === 'town';
                const hpRegen = inTown ? st.maxHp * 0.40 : st.maxHp * (0.015 + st.treeHpRegenBonus);
                const mpRegen = inTown ? st.maxMp * 0.50 : (4.5 + this.saveData.stats.int * 0.45) * st.treeMpRegenMult;
                this.player.hp = Math.min(st.maxHp, this.player.hp + hpRegen * dt);
                this.player.mp = Math.min(st.maxMp, this.player.mp + mpRegen * dt);

                // 移動入力（左スティック＆キーボード）
                let mx = this.joyVec.x;
                let mz = this.joyVec.y;
                if (this.keys['KeyW'] || this.keys['ArrowUp']) mz -= 1;
                if (this.keys['KeyS'] || this.keys['ArrowDown']) mz += 1;
                if (this.keys['KeyA'] || this.keys['ArrowLeft']) mx -= 1;
                if (this.keys['KeyD'] || this.keys['ArrowRight']) mx += 1;

                const mag = Math.hypot(mx, mz);
                if (mag > 0.05 && this.player.stunTimer <= 0 && !this.isModalOpen) {
                    const nx = mx / Math.max(1, mag);
                    const nz = mz / Math.max(1, mag);
                    const sin = Math.sin(this.camYaw);
                    const cos = Math.cos(this.camYaw);
                    const wx = nx * cos + nz * sin;
                    const wz = -nx * sin + nz * cos;

                    this.player.pos.x += wx * st.moveSpeed * dt;
                    this.player.pos.z += wz * st.moveSpeed * dt;
                    this.clampPosition(this.player.pos);
                    this.player.rotY = Math.atan2(wx, wz);
                } else if (this.autoHunt && this.player.stunTimer <= 0 && !this.isModalOpen && !inTown) {
                    // AUTO狩り移動＆自動スキル
                    const target = this.getNearestMonster(45);
                    if (target && !target.dead) {
                        this.selectedTarget = target;
                        const dx = target.pos.x - this.player.pos.x;
                        const dz = target.pos.z - this.player.pos.z;
                        const dist = Math.hypot(dx, dz);
                        if (dist > 3.6) {
                            this.player.pos.x += (dx / dist) * st.moveSpeed * dt;
                            this.player.pos.z += (dz / dist) * st.moveSpeed * dt;
                            this.clampPosition(this.player.pos);
                            this.player.rotY = Math.atan2(dx, dz);
                        } else {
                            this.autoSkillTimer -= dt;
                            if (this.autoSkillTimer <= 0) {
                                this.autoSkillTimer = 0.7;
                                for (let i = 0; i < 5; i++) {
                                    const skId = this.saveData.equippedSkills[i];
                                    const sk = skId ? SKILLS[skId] : null;
                                    if (!sk) continue;
                                    if ((sk.type === 'HEAL' || sk.type === 'HEAL_MP') && this.player.hp > st.maxHp * 0.65) continue;
                                    if (this.player.skillCds[i] <= 0 && this.player.mp >= sk.cost) {
                                        this.useSkillSlot(i);
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }

                // プレイヤー3D姿勢・エモートモーション反映
                if (this.player.group) {
                    this.player.group.position.copy(this.player.pos);
                    if (this.emoteTimer > 0 && this.emoteMotion === 'jump') {
                        this.player.group.position.y = Math.abs(Math.sin(elapsed * 12)) * 0.65;
                    } else if (this.emoteTimer > 0 && this.emoteMotion === 'spin') {
                        this.player.rotY += dt * 10.5;
                    } else if (this.emoteTimer > 0 && this.emoteMotion === 'flip') {
                        this.player.group.position.y = Math.abs(Math.sin(elapsed * 16)) * 0.85;
                        this.player.rotY += dt * 7.5;
                        if (this.player.wpnGroup) this.player.wpnGroup.rotation.x = Math.sin(elapsed * 24) * 1.4;
                    } else if (this.emoteTimer > 0 && this.emoteMotion === 'beam') {
                        if (this.player.wpnGroup) this.player.wpnGroup.rotation.x = 1.45;
                    } else if (this.emoteTimer > 0 && this.emoteMotion === 'bow' && this.player.head) {
                        this.player.head.position.y = 1.15;
                        this.player.head.rotation.x = 0.65;
                    } else if (this.emoteTimer > 0 && this.emoteMotion === 'shake' && this.player.head) {
                        this.player.head.rotation.z = Math.sin(elapsed * 26) * 0.22;
                    } else {
                        if (mag > 0.05) {
                            this.player.group.position.y = Math.abs(Math.sin(elapsed * 14)) * 0.14;
                        }
                        if (this.player.head) {
                            this.player.head.position.y = 1.62;
                            this.player.head.rotation.x = 0;
                            this.player.head.rotation.z = 0;
                        }
                    }
                    this.player.group.rotation.y = this.player.rotY;
                    if (this.player.wpnGroup && this.emoteMotion !== 'beam' && this.emoteMotion !== 'flip') {
                        this.player.wpnGroup.rotation.x *= 0.82;
                    }
                }

                // オート通常攻撃（移動中でも射程内の敵へ自動攻撃）
                if (this.autoAttack && !this.isModalOpen && this.player.stunTimer <= 0 && !inTown) {
                    const target = this.getNearestMonster(4.8) || this.getValidTarget();
                    if (target && !target.dead && this.player.pos.distanceTo(target.pos) <= 4.7) {
                        this.selectedTarget = target;
                        this.autoAtkTimer -= dt;
                        if (this.autoAtkTimer <= 0) {
                            this.autoAtkTimer = Math.max(0.45, 1.05 * (1 - st.cdReduction * 0.6));
                            const crit = Math.random() < st.critChance;
                            this.damageMonster(target, st.physAtk * (crit ? st.critDmg : 1), crit);
                            this.spawnSlashEffect(target.pos, 0x38bdf8);
                            if (this.player.wpnGroup) this.player.wpnGroup.rotation.x = 1.25;
                        }
                    }
                }

                this.updateBarsOnly();
            }

            updateMonsters(dt) {
                if (!this.player) return;
                const pPos = this.player.pos;

                this.monsters.forEach(m => {
                    if (m.dead) {
                        m.respawnTimer -= dt;
                        if (m.respawnTimer <= 0) {
                            m.dead = false;
                            m.hp = m.maxHp;
                            m.aggro = false;
                            m.casting = null;
                            m.stunTimer = 0;
                            m.slowTimer = 0;
                            m.burnTimer = 0;
                            m.pos.copy(m.spawnPos);
                            if (m.group) {
                                m.group.position.copy(m.pos);
                                m.group.visible = true;
                            }
                            if (m.plateEl) m.plateEl.style.display = 'block';
                        }
                        return;
                    }

                    // 状態異常タイマー
                    if (m.stunTimer > 0) m.stunTimer = Math.max(0, m.stunTimer - dt);
                    if (m.slowTimer > 0) {
                        m.slowTimer = Math.max(0, m.slowTimer - dt);
                        if (m.slowTimer <= 0) m.slowFactor = 1.0;
                    }
                    if (m.burnTimer > 0) {
                        m.burnTimer = Math.max(0, m.burnTimer - dt);
                        this.damageMonster(m, m.burnDps * dt, false);
                        if (m.dead) return;
                    }

                    if (m.stunTimer > 0) return;

                    // ボス大技詠唱進行
                    if (m.casting) {
                        m.casting.elapsed += dt;
                        const pct = Math.min(100, (m.casting.elapsed / m.casting.duration) * 100);
                        const bar = document.getElementById('boss-cast-bar');
                        if (bar) bar.style.width = `${pct}%`;
                        if (m.casting.elapsed >= m.casting.duration) {
                            m.casting = null;
                            document.getElementById('boss-cast-box')?.classList.add('hidden');
                            this.spawnRingEffect(m.pos, 0xf43f5e, 9.5);
                            if (pPos.distanceTo(m.pos) <= 9.5) {
                                this.damagePlayer(m.atk * 2.2);
                                this.showAlertBanner(`💥 ${m.name}の大技が炸裂！`, 1600);
                            }
                        }
                        return;
                    }

                    const dist = m.pos.distanceTo(pPos);
                    if (dist < 14.5) m.aggro = true;
                    if (!m.aggro) return;

                    const spdMult = m.slowTimer > 0 ? (m.slowFactor || 0.5) : 1.0;
                    const moveSpd = (m.isBoss ? 4.3 : 5.1) * spdMult;
                    const stopRange = m.isBoss ? 3.8 : 2.8;

                    if (dist > stopRange) {
                        const dx = pPos.x - m.pos.x;
                        const dz = pPos.z - m.pos.z;
                        m.pos.x += (dx / dist) * moveSpd * dt;
                        m.pos.z += (dz / dist) * moveSpd * dt;
                        if (m.group) {
                            m.group.position.copy(m.pos);
                            m.group.rotation.y = Math.atan2(dx, dz);
                        }
                    } else {
                        m.autoTimer -= dt * spdMult;
                        if (m.autoTimer <= 0) {
                            m.autoTimer = m.isBoss ? 2.1 : 1.8;
                            this.damagePlayer(m.atk);
                            this.spawnSlashEffect(pPos, m.color);
                        }
                    }

                    if (m.isRaidBoss) {
                        m.mechTimer -= dt * spdMult;
                        if (m.mechTimer <= 0) {
                            m.mechTimer = 8.0;
                            m.casting = { name: '終焉の星屑爆発', elapsed: 0, duration: 2.8 };
                            const titleEl = document.getElementById('boss-cast-title');
                            if (titleEl) titleEl.textContent = `⚠️ ${m.name}「${m.casting.name}」詠唱中！(破邪の衝撃で中断)`;
                            const barEl = document.getElementById('boss-cast-bar');
                            if (barEl) barEl.style.width = '0%';
                            document.getElementById('boss-cast-box')?.classList.remove('hidden');
                        }
                    }
                });
            }

            updateAiAllies(dt) {
                this.aiAllies.forEach(a => {
                    a.wanderTimer -= dt;
                    if (a.wanderTimer <= 0) {
                        a.wanderTimer = 2.5 + Math.random() * 2.5;
                        a.targetOffset.set((Math.random() - 0.5) * 4.5, 0, (Math.random() - 0.5) * 4.5);
                    }
                    const tx = a.homePos.x + a.targetOffset.x;
                    const tz = a.homePos.z + a.targetOffset.z;
                    const dx = tx - a.pos.x;
                    const dz = tz - a.pos.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist > 0.25) {
                        a.pos.x += (dx / dist) * 2.2 * dt;
                        a.pos.z += (dz / dist) * 2.2 * dt;
                        if (a.group) {
                            a.group.position.copy(a.pos);
                            a.group.rotation.y = Math.atan2(dx, dz);
                        }
                    }
                });
            }

            projectToScreen(worldPos) {
                if (!this.useWebGL || !this.camera) return null;
                const v = worldPos.clone().project(this.camera);
                if (v.z > 1) return null;
                return {
                    x: (v.x * 0.5 + 0.5) * window.innerWidth,
                    y: (-v.y * 0.5 + 0.5) * window.innerHeight
                };
            }

            updateEffectsAndOverlays(dt) {
                // 3Dエフェクト減衰
                for (let i = this.effects.length - 1; i >= 0; i--) {
                    const ef = this.effects[i];
                    ef.life -= dt;
                    if (ef.life <= 0) {
                        if (this.scene && ef.mesh) this.scene.remove(ef.mesh);
                        this.effects.splice(i, 1);
                    } else {
                        const ratio = ef.life / ef.maxLife;
                        if (ef.mesh && ef.mesh.material) ef.mesh.material.opacity = ratio;
                        if (ef.expand && ef.mesh) {
                            const s = 1 + (1 - ratio) * 0.35;
                            ef.mesh.scale.set(s, s, 1);
                        }
                    }
                }

                // カメラ追従
                if (this.useWebGL && this.camera && this.player) {
                    const cx = this.player.pos.x + Math.sin(this.camYaw) * Math.cos(this.camPitch) * this.camDist;
                    const cy = this.player.pos.y + Math.sin(this.camPitch) * this.camDist;
                    const cz = this.player.pos.z + Math.cos(this.camYaw) * Math.cos(this.camPitch) * this.camDist;
                    this.camera.position.set(cx, cy, cz);
                    this.camera.lookAt(this.player.pos.x, this.player.pos.y + 1.2, this.player.pos.z);
                }

                // モンスター頭上HPバー投影
                this.monsters.forEach(m => {
                    if (m.dead || !m.plateEl) return;
                    const sc = this.projectToScreen(new THREE.Vector3(m.pos.x, (m.scale || 1) * 2.55, m.pos.z));
                    if (!sc) {
                        m.plateEl.style.display = 'none';
                        return;
                    }
                    m.plateEl.style.display = 'block';
                    m.plateEl.style.left = `${sc.x}px`;
                    m.plateEl.style.top = `${sc.y}px`;
                    m.plateEl.style.borderColor = (this.selectedTarget === m) ? '#38bdf8' : 'rgba(248,113,113,0.55)';
                    const fill = m.plateEl.querySelector('.m-hp-fill');
                    if (fill) fill.style.width = `${Math.max(0, (m.hp / m.maxHp) * 100)}%`;
                });

                // フローティングダメージテキスト
                for (let i = this.floatTexts.length - 1; i >= 0; i--) {
                    const ft = this.floatTexts[i];
                    ft.life -= dt;
                    ft.worldPos.y += dt * 1.45;
                    if (ft.life <= 0) {
                        ft.el.remove();
                        this.floatTexts.splice(i, 1);
                    } else {
                        const sc = this.projectToScreen(ft.worldPos);
                        if (sc) {
                            ft.el.style.left = `${sc.x}px`;
                            ft.el.style.top = `${sc.y}px`;
                            ft.el.style.opacity = `${Math.min(1, ft.life * 2)}`;
                        }
                    }
                }

                // エモート吹き出し
                for (let i = this.emoteBubbles.length - 1; i >= 0; i--) {
                    const eb = this.emoteBubbles[i];
                    eb.life -= dt;
                    if (eb.life <= 0) {
                        eb.el.remove();
                        this.emoteBubbles.splice(i, 1);
                    } else {
                        const sc = this.projectToScreen(eb.worldPos);
                        if (sc) {
                            eb.el.style.left = `${sc.x}px`;
                            eb.el.style.top = `${sc.y}px`;
                        }
                    }
                }
            }

                    <button class="emote-quick-btn" data-emote="${em.id}">

                        <span style="font-size:9px; font-weight:900; color:#f8fafc;">${em.label}</span>

                    btn.addEventListener('click', (e) => {

            refreshAllHUD() {
                const d = this.saveData;
                const evo = EVOLUTIONS[d.evolutionId] || EVOLUTIONS.novice;
                const zone = ZONES[this.currentZoneId] || ZONES.town;

                document.getElementById('hud-kaomoji').textContent = this.getBasePlayerKaomoji();
                document.getElementById('hud-name').textContent = evo.name;
                document.getElementById('hud-lv').textContent = d.rebirthCount > 0 ? `Lv.${d.lv} (転生${d.rebirthCount})` : `Lv.${d.lv}`;
                document.getElementById('hud-gold').textContent = `${formatBigNum(d.gold)}G`;

                const titleEl = document.getElementById('hud-title-badge');
                if (d.exTitle && d.exTitle.trim()) {
                    titleEl.textContent = d.exTitle.trim();
                    titleEl.classList.remove('hidden');
                } else {
                    titleEl.classList.add('hidden');
                }

                document.getElementById('hud-stage-badge').textContent = `STAGE ${zone.stageNum}`;
                document.getElementById('hud-zone-name').textContent = zone.name;

                const threatBadge = document.getElementById('hud-threat-badge');
                if ((d.threatRank || 0) > 0) {
                    threatBadge.textContent = `脅威+${d.threatRank}`;
                    threatBadge.classList.remove('hidden');
                } else {
                    threatBadge.classList.add('hidden');
                }

                const safeBadge = document.getElementById('hud-safe-badge');
                if (zone.safe) {
                    safeBadge.textContent = '🛡️安全街';
                    safeBadge.style.background = '#059669';
                } else {
                    safeBadge.textContent = '⚔️狩場';
                    safeBadge.style.background = '#e11d48';
                }

                const alertDot = document.getElementById('badge-growth-alert');
                if (d.ap > 0 || d.sp > 0) {
                    alertDot?.classList.remove('hidden');
                } else {
                    alertDot?.classList.add('hidden');
                }

                // 大型マルチタッチ対応スキルパッド5枠生成
                const slotWrap = document.getElementById('skill-slots-container');
                slotWrap.innerHTML = [0, 1, 2, 3, 4].map(i => {
                    const skId = d.equippedSkills[i];
                    const sk = skId ? SKILLS[skId] : null;
                    if (!sk) {
                        return `<button class="skill-slot-btn" style="opacity:0.35;" disabled><span style="font-size:10px; font-weight:800;">空枠${i + 1}</span></button>`;
                    }
                    const shortName = sk.name.slice(0, 4);
                    return `
                        <button class="skill-slot-btn" data-slot="${i}">
                            <span style="font-size:19px; line-height:1;">${sk.icon}</span>
                            <span style="font-size:9px; font-weight:900; color:#fff; margin-top:2px; line-height:1;">${shortName}</span>
                            <span style="font-size:8px; font-weight:800; color:#7dd3fc; margin-top:2px; line-height:1;">MP${sk.cost}</span>
                            <div id="skill-cd-${i}" class="skill-cd-overlay hidden">0.0</div>
                        </button>
                    `;
                }).join('');

                // 移動スティック操作中でも別指で即発動できるよう touchstart と mousedown の両方でバインド
                slotWrap.querySelectorAll('.skill-slot-btn[data-slot]').forEach(btn => {
                    const slotNum = Number(btn.dataset.slot);
                    let lastFire = 0;
                    const triggerSkill = (e) => {
                        if (e) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                        const now = performance.now();
                        if (now - lastFire < 120) return;
                        lastFire = now;
                        this.useSkillSlot(slotNum);
                    };
                    btn.addEventListener('touchstart', triggerSkill, { passive: false });
                    btn.addEventListener('mousedown', triggerSkill);
                });

                this.updateBarsOnly();
            }

            updateBarsOnly() {
                if (!this.player) return;
                const d = this.saveData;
                const st = this.calcDerivedStats();
                const needExp = this.getExpNeeded(d.lv);

                document.getElementById('hud-hp-text').textContent = `${formatBigNum(this.player.hp)}/${formatBigNum(st.maxHp)}`;
                document.getElementById('hud-hp-bar').style.width = `${Math.min(100, (this.player.hp / st.maxHp) * 100)}%`;

                document.getElementById('hud-mp-text').textContent = `${formatBigNum(this.player.mp)}/${formatBigNum(st.maxMp)}`;
                document.getElementById('hud-mp-bar').style.width = `${Math.min(100, (this.player.mp / st.maxMp) * 100)}%`;

                document.getElementById('hud-exp-text').textContent = d.lv >= 99 ? 'MAX (転生可能)' : `${formatBigNum(d.exp)}/${formatBigNum(needExp)}`;
                document.getElementById('hud-exp-bar').style.width = d.lv >= 99 ? '100%' : `${Math.min(100, (d.exp / needExp) * 100)}%`;

                for (let i = 0; i < 5; i++) {
                    const cdEl = document.getElementById(`skill-cd-${i}`);
                    if (!cdEl) continue;
                    const cd = this.player.skillCds[i] || 0;
                    if (cd > 0.05) {
                        cdEl.textContent = cd.toFixed(1);
                        cdEl.classList.remove('hidden');
                    } else {
                        cdEl.classList.add('hidden');
                    }
                }
            }

            // モーダル・全育成タブ描画（ステージ／ステ振り／鍛冶／スキル／ツリー／進化／神話・転生／表情）
            // -----------------------------------------------------------------
            canEvolveTo(evo) {
                const d = this.saveData;
                if (d.lv < evo.reqLv) return false;
                if (evo.reqEvo && d.evolutionId !== evo.reqEvo) return false;
                for (const [mk, cnt] of Object.entries(evo.reqMat || {})) {
                    if ((d.materials[mk] || 0) < cnt) return false;
                }
                return true;
            }

            openGrowthModal(tab = 'stats') {
                this.activeTab = tab;
                this.isModalOpen = true;
                document.getElementById('hud-drawer-menu')?.classList.add('hidden');
                document.getElementById('emote-palette')?.classList.add('hidden');
                document.getElementById('growth-modal').classList.remove('hidden');
                this.renderModalContent();
            }

            closeGrowthModal() {
                this.isModalOpen = false;
                document.getElementById('growth-modal').classList.add('hidden');
                this.refreshAllHUD();
            }

            openDialog(title, message, buttons) {
                const modal = document.getElementById('dialog-modal');
                document.getElementById('dialog-title').textContent = title;
                document.getElementById('dialog-message').textContent = message;
                const btnWrap = document.getElementById('dialog-buttons');
                btnWrap.innerHTML = '';
                buttons.forEach(b => {
                    const btn = document.createElement('button');
                    btn.className = `btn-ui ${b.primary ? 'btn-amber' : 'btn-slate'}`;
                    btn.textContent = b.text;
                    btn.addEventListener('click', () => {
                        modal.classList.add('hidden');
                        if (b.onClick) b.onClick();
                    });
                    btnWrap.appendChild(btn);
                });
                modal.classList.remove('hidden');
            }

            // -----------------------------------------------------------------
            // イベントバインド（マルチタッチ対応スティック・カメラ・戦闘ボタン）
            // -----------------------------------------------------------------
            bindEvents() {
                // 左仮想スティック（指IDを追跡して右指のスキル操作と完全干渉防止）
                const joyZone = document.getElementById('joystick-zone');
                const joyStick = document.getElementById('joystick-stick');
                let joyTouchId = null;
                const maxRadius = 36;

                const updateStickPos = (clientX, clientY) => {
                    const rect = joyZone.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    let dx = clientX - cx;
                    let dy = clientY - cy;
                    const dist = Math.hypot(dx, dy);
                    if (dist > maxRadius) {
                        dx = (dx / dist) * maxRadius;
                        dy = (dy / dist) * maxRadius;
                    }
                    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
                    this.joyVec.x = dx / maxRadius;
                    this.joyVec.y = dy / maxRadius;
                };

                const resetStick = () => {
                    joyTouchId = null;
                    joyStick.style.transform = 'translate(0px, 0px)';
                    this.joyVec.x = 0;
                    this.joyVec.y = 0;
                };

                joyZone.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (joyTouchId !== null) return;
                    const t = e.changedTouches[0];
                    joyTouchId = t.identifier;
                    updateStickPos(t.clientX, t.clientY);
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (joyTouchId === null) return;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        const t = e.changedTouches[i];
                        if (t.identifier === joyTouchId) {
                            updateStickPos(t.clientX, t.clientY);
                            break;
                        }
                    }
                }, { passive: true });

                window.addEventListener('touchend', (e) => {
                    if (joyTouchId === null) return;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === joyTouchId) {
                            resetStick();
                            break;
                        }
                    }
                });
                window.addEventListener('touchcancel', resetStick);

                let mouseJoy = false;
                joyZone.addEventListener('mousedown', (e) => {
                    mouseJoy = true;
                    updateStickPos(e.clientX, e.clientY);
                });
                window.addEventListener('mousemove', (e) => {
                    if (mouseJoy) updateStickPos(e.clientX, e.clientY);
                });
                window.addEventListener('mouseup', () => {
                    if (mouseJoy) {
                        mouseJoy = false;
                        resetStick();
                    }
                });

                // 3Dキャンバスドラッグでカメラ視点回転
                let camDragId = null;
                let lastCamX = 0;
                this.canvas.addEventListener('touchstart', (e) => {
                    if (camDragId === null && e.changedTouches.length > 0) {
                        camDragId = e.changedTouches[0].identifier;
                        lastCamX = e.changedTouches[0].clientX;
                    }
                }, { passive: true });
                this.canvas.addEventListener('touchmove', (e) => {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        const t = e.changedTouches[i];
                        if (t.identifier === camDragId) {
                            this.camYaw -= (t.clientX - lastCamX) * 0.008;
                            lastCamX = t.clientX;
                        }
                    }
                }, { passive: true });
                this.canvas.addEventListener('touchend', (e) => {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === camDragId) camDragId = null;
                    }
                });

                let mouseCam = false;
                this.canvas.addEventListener('mousedown', (e) => {
                    mouseCam = true;
                    lastCamX = e.clientX;
                });
                window.addEventListener('mousemove', (e) => {
                    if (mouseCam) {
                        this.camYaw -= (e.clientX - lastCamX) * 0.007;
                        lastCamX = e.clientX;
                    }
                });
                window.addEventListener('mouseup', () => { mouseCam = false; });

                // キーボード操作（PC向け）
                window.addEventListener('keydown', (e) => {
                    if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                    this.keys[e.code] = true;
                    if (e.code === 'Digit1') this.useSkillSlot(0);
                    if (e.code === 'Digit2') this.useSkillSlot(1);
                    if (e.code === 'Digit3') this.useSkillSlot(2);
                    if (e.code === 'Digit4') this.useSkillSlot(3);
                    if (e.code === 'Digit5') this.useSkillSlot(4);
                    if (e.code === 'Space') document.getElementById('btn-basic-attack')?.click();
                });
                window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

                // 上部HUDボタン類
                document.getElementById('btn-open-travel')?.addEventListener('click', () => this.openGrowthModal('travel'));
                document.getElementById('btn-open-growth')?.addEventListener('click', () => this.openGrowthModal('stats'));
                document.getElementById('btn-close-modal')?.addEventListener('click', () => this.closeGrowthModal());

                document.getElementById('btn-toggle-autohunt')?.addEventListener('click', (e) => {
                    if (this.currentZoneId === 'town') {
                        this.showAlertBanner('安全な街ではAUTO狩りできません。ステージへ移動しよう！', 1600);
                        return;
                    }
                    this.autoHunt = !this.autoHunt;
                    e.currentTarget.textContent = this.autoHunt ? '🤖 AUTO:ON' : '🤖 AUTO:OFF';
                    this.showAlertBanner(this.autoHunt ? '🤖 AUTO狩りを開始しました！' : '🤖 AUTO狩りを停止しました', 1300);
                });

                document.getElementById('btn-toggle-drawer')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.getElementById('hud-drawer-menu')?.classList.toggle('hidden');
                });

                document.getElementById('btn-threat-up')?.addEventListener('click', () => {
                    this.saveData.threatRank = Math.min(20, (this.saveData.threatRank || 0) + 1);
                    this.loadZone(this.currentZoneId);
                    this.showAlertBanner(`🔥 脅威度ランク +${this.saveData.threatRank} に上昇！`, 1400);
                });
                document.getElementById('btn-threat-down')?.addEventListener('click', () => {
                    this.saveData.threatRank = Math.max(0, (this.saveData.threatRank || 0) - 1);
                    this.loadZone(this.currentZoneId);
                    this.showAlertBanner(`❄️ 脅威度ランク +${this.saveData.threatRank} に変更`, 1400);
                });
                document.getElementById('btn-manual-save')?.addEventListener('click', () => {
                    document.getElementById('hud-drawer-menu')?.classList.add('hidden');
                    this.saveGame(true);
                });

                // 中央ワープ陣の帰還ボタン
                document.getElementById('btn-exec-warp')?.addEventListener('click', () => {
                    this.autoHunt = false;
                    const autoBtn = document.getElementById('btn-toggle-autohunt');
                    if (autoBtn) autoBtn.textContent = '🤖 AUTO:OFF';
                    this.loadZone('town');
                    sfx.playLevelUp();
                    this.showAlertBanner('🏠 安全な街「始まりの顔文字広場」へ帰還しました！', 2200);
                });

                // 右下エモートパレット＆戦闘ボタン（マルチタッチ即応）
                document.getElementById('btn-toggle-emote')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.getElementById('emote-palette')?.classList.toggle('hidden');
                });

                const bindInstantAction = (elId, fn) => {
                    const el = document.getElementById(elId);
                    if (!el) return;
                    let lastT = 0;
                    const handler = (e) => {
                        if (e) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                        const now = performance.now();
                        if (now - lastT < 120) return;
                        lastT = now;
                        fn();
                    };
                    el.addEventListener('touchstart', handler, { passive: false });
                    el.addEventListener('mousedown', handler);
                };

                bindInstantAction('btn-basic-attack', () => {
                    const target = this.getValidTarget();
                    if (target && !target.dead && this.player.pos.distanceTo(target.pos) <= 5.2) {
                        const st = this.calcDerivedStats();
                        const crit = Math.random() < st.critChance;
                        this.damageMonster(target, st.physAtk * (crit ? st.critDmg : 1), crit);
                        this.spawnSlashEffect(target.pos, 0x38bdf8);
                        if (this.player.wpnGroup) this.player.wpnGroup.rotation.x = 1.3;
                    } else {
                        this.showAlertBanner('攻撃範囲内に敵がいません！近づこう！', 1100);
                    }
                });

                bindInstantAction('btn-cycle-target', () => this.cycleTarget());
            }
        }

        // 起動
        window.addEventListener('DOMContentLoaded', () => {
            window.kaomojiGame = new KaomojiMMORPG();
        });
    })();
    </script>
</body>
</html>
